name: publish the landing page
# here.events: a static page (site/), published to GitHub Pages on every push.
# The map's cities come from site/cities.json; scripts/digest.mjs refreshes the
# "What's on" section from every site's events.json once a day, after the city runs.
on:
  push:
    branches: [main]
  schedule:
    - cron: '45 23 * * *'
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/digest.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
